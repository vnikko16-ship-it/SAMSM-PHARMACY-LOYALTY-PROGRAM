name: Build SAMCM Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - "samcm-native-android-source.zip"
      - ".github/workflows/build-native-apk.yml"

permissions:
  contents: read

jobs:
  build-installable-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source archive
        uses: actions/checkout@v4
      - name: Extract native Android source
        run: unzip -q samcm-native-android-source.zip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble installable debug APK
        run: gradle --no-daemon -p native-android :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMCM-Pharmacy-Loyalty-Program-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
